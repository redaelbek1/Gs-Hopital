{% extends 'base_app/base.html' %}

{% block title %}Connexion - HôpitalGS{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-brand">
            <i class="fas fa-hospital"></i>
            <h1>HôpitalGS</h1>
            <p>Système de Gestion Hospitalière</p>
        </div>

        <div class="card">
            <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 24px; text-align: center;">Connexion</h2>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email"><i class="fas fa-envelope"></i> Email</label>
                    {{ form.email }}
                </div>
                <div class="form-group">
                    <label for="id_password"><i class="fas fa-lock"></i> Mot de passe</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px;">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
            </form>

            <div class="auth-footer">
                Pas encore de compte ?
                <a href="{% url 'users:register' %}">S'inscrire</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
